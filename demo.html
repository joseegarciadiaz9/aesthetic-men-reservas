<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aesthetic Men · Demo de reservas</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;background:#0A0A0A radial-gradient(circle at 22% 40%,#1c1c1c,#0A0A0A 60%);color:#EEEBE5;font-family:"Inter Tight",system-ui,sans-serif;display:grid;grid-template-columns:auto 1fr;gap:40px;padding:34px 40px;overflow:hidden}
.side{display:flex;flex-direction:column;align-items:center;gap:14px}
.lbl{font-family:"Syncopate",sans-serif;font-size:.58rem;letter-spacing:.3em;color:#8E8B85;text-transform:uppercase}
.phone{width:400px;height:calc(100vh - 110px);max-height:860px;border-radius:52px;padding:12px;background:#1a1a1a;box-shadow:0 0 0 2px #2a2a2a,0 40px 90px rgba(0,0,0,.6)}
.phone iframe{width:100%;height:100%;border:0;border-radius:40px;background:#0A0A0A}
.desk{display:flex;flex-direction:column;gap:14px;min-width:0}
.desk .win{flex:1;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #2a2a2a,0 40px 90px rgba(0,0,0,.6);display:flex;flex-direction:column;background:#fff}
.desk .chrome{height:34px;background:#EDEBE7;display:flex;align-items:center;gap:7px;padding:0 14px}
.desk .chrome i{width:11px;height:11px;border-radius:50%;background:#D5D2CC}
.desk iframe{flex:1;border:0;width:100%}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head b{font-family:"Syncopate",sans-serif;letter-spacing:.2em;font-size:.8rem}
</style>
</head>
<body>
<div class="side">
  <span class="lbl">Lo que ve el cliente</span>
  <div class="phone"><iframe src="index.html#reservar" title="Web de reservas en el móvil" id="client"></iframe></div>
</div>
<div class="desk">
  <div class="head"><b>AESTHETIC — MEN</b><span class="lbl">Lo que ve Bilal en su calendario</span></div>
  <div class="win"><div class="chrome"><i></i><i></i><i></i></div><iframe src="panel.html" title="Agenda del barbero" id="panel"></iframe></div>
</div>
</body>
</html>
